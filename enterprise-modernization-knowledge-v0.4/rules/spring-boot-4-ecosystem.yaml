- id: ECO4-BATCH-005
  title: Spring Batch Metadata JDBC 的明確選擇
  category: DEFAULT_BEHAVIOR_CHANGE
  severity: CRITICAL
  priority: P0
  evidence_class: DOCUMENTED_CHANGE
  documented_change_or_risk: Boot 4 的一般 spring-boot-starter-batch 可不依賴 DB，若原系統依靠 JDBC JobRepository，應選 spring-boot-starter-batch-jdbc
    以保留 metadata 持久化。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - spring-boot-starter-batch
    - JdbcJobRepository
    - JobExplorer
    must_resolve:
    - existing job metadata database
    - restartability
    - transaction manager
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - SELECT_BATCH_JDBC_STARTER_IF_PERSISTENCE_REQUIRED
  verification:
    required:
    - job restart after crash
    - execution metadata rows
    - duplicate job params
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - BOOT4_MIGRATION
  review_status: DOCUMENTATION_GROUNDED_PROJECT_VALIDATION_PENDING
