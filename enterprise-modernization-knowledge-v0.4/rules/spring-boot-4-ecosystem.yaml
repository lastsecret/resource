schema_version: '0.4'
knowledge_pack: spring-boot-3-to-4
scope: Spring Boot 3.5.x -> 4.0.x; Java target is resolved from migration config; exact component versions required
rules:
- id: ECO4-SPRINGDOC-001
  title: springdoc-openapi 2→3 支援矩陣
  category: THIRD_PARTY_COMPATIBILITY
  severity: HIGH
  priority: P0
  evidence_class: DOCUMENTED_CHANGE
  documented_change_or_risk: springdoc 官網相容矩陣：Boot 3 使用 springdoc 2.x，Boot 4.0 使用 3.0.x，Boot 4.1 可使用 3.1.x–3.2.x；依精確
    Boot 版本選相容線。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - org.springdoc:springdoc-openapi*
    must_resolve:
    - effective springdoc group
    - version
    - webmvc/webflux starter
    - Swagger annotations
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - ALIGN_VERSION
  - SELECT_CORRECT_UI_STARTER
  verification:
    required:
    - GET /v3/api-docs
    - Swagger UI
    - schema diff
    - error on startup
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - SPRINGDOC_FAQ
  review_status: DOCUMENTATION_GROUNDED_PROJECT_VALIDATION_PENDING
