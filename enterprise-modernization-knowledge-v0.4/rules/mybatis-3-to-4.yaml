schema_version: '0.4'
knowledge_pack: spring-boot-3-to-4
scope: Spring Boot 3.5.x -> 4.0.x; Java target is resolved from migration config; exact component versions required
rules:
- id: MYB4-STARTER-001
  title: MyBatis Starter 版本相容性
  category: DEPENDENCY_CHANGE
  severity: HIGH
  priority: P0
  evidence_class: DOCUMENTED_CHANGE
  documented_change_or_risk: MyBatis-Spring-Boot-Starter 3.0 系列對應 Boot 3.2–3.5；4.0 系列對應 Boot 4.0；MyBatis-Spring
    4.0 對應 Spring Framework 7；MyBatis Core 仍為 3.5 系列。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - org.mybatis.spring.boot:mybatis-spring-boot-starter
    - org.mybatis:mybatis-spring
    - org.mybatis:mybatis
    must_resolve:
    - exact Boot Framework
    - starter
    - MyBatis-Spring
    - MyBatis Core and BOM versions; Nexus availability
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - ALIGN_VERIFIED_VERSION_MATRIX
  - REVIEW_OVERRIDES
  - KEEP_CORE_3_5_IF_SUPPORTED
  verification:
    required:
    - dependency convergence
    - context startup
    - mapper select
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_REQ
  - MYBATIS_SPRING_REQ
  review_status: DOCUMENTATION_GROUNDED_PROJECT_VALIDATION_PENDING
- id: MYB4-MAPPER-002
  title: Mapper 掃描與 XML 資源載入
  category: INTEGRATION_RISK
  severity: HIGH
  priority: P0
  evidence_class: COMPATIBILITY_ASSESSMENT
  documented_change_or_risk: Starter 會掃描 Mapper 並建立 SqlSessionTemplate；自訂 MapperFactoryBean 可能改變自動掃描是否啟動。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - '@MapperScan'
    - '@Mapper'
    - MapperFactoryBean
    - mapper-locations
    must_resolve:
    - base packages
    - XML glob
    - active profiles
    - resource inclusion in jar and external resources
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - RESTORE_SCANNING_IF_MISSING
  - CORRECT_RESOURCE_PATHS
  - NO_CHANGE_IF_IDENTICAL
  verification:
    required:
    - mapper bean count
    - mapped statement list
    - SQL smoke with parameters
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_DOC
  review_status: RISK_ASSESSMENT_REQUIRES_PROJECT_EVIDENCE
- id: MYB4-HANDLER-003
  title: 自訂 TypeHandler / Enum / NULL / 時間型別
  category: DATA_MAPPING_RISK
  severity: HIGH
  priority: P0
  evidence_class: COMPATIBILITY_ASSESSMENT
  documented_change_or_risk: 自訂 TypeHandler 與預設 JDBC TypeHandler 需依實際欄位與 Mapper 確認；不能因 major 升級推論一定改變。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - TypeHandler
    - '@MappedTypes'
    - '@MappedJdbcTypes'
    - javaType
    - jdbcType
    must_resolve:
    - TypeHandler precedence
    - per-mapper binding
    - database driver
    - actual SQL types
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - KEEP_SOURCE_BEHAVIOR_WITH_SCOPED_HANDLER
  - NO_CHANGE_IF_SAME
  - REVIEW_UNKNOWN
  verification:
    required:
    - null, non-null, enum unknown, DATE/TIMESTAMP read-write golden records
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_DOC
  review_status: RISK_ASSESSMENT_REQUIRES_PROJECT_EVIDENCE
- id: MYB4-CONFIG-004
  title: MyBatis 有效設定與預設值
  category: CONFIGURATION_RISK
  severity: HIGH
  priority: P0
  evidence_class: DOCUMENTED_CHANGE
  documented_change_or_risk: MyBatis configuration.*、XML config-location 和 Java ConfigurationCustomizer 會影響結果；configuration.*
    與 config-location 不可同時使用。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - mybatis.configuration.*
    - config-location
    - ConfigurationCustomizer
    must_resolve:
    - active profile
    - XML config
    - programmatic overrides
    - mybatis bean instance
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - PRESERVE_EFFECTIVE_SETTINGS
  - ELIMINATE_CONFLICT
  - NO_CHANGE_IF_MATCH
  verification:
    required:
    - config effective dump
    - same input field mapping, timeout and cache behavior
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_DOC
  review_status: DOCUMENTATION_GROUNDED_PROJECT_VALIDATION_PENDING
- id: MYB4-MULTIDS-005
  title: 多 DataSource 的 SqlSessionFactory 與交易邊界
  category: TRANSACTION_RISK
  severity: HIGH
  priority: P0
  evidence_class: DOCUMENTED_CHANGE
  documented_change_or_risk: 手動設定 SqlSessionFactory 時，部分 Starter 自動配置行為不會自動套用，需檢查 VFS、Factory、Template 和 TransactionManager
    關聯。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - SqlSessionFactoryBean
    - SqlSessionTemplate
    - '@MapperScan sqlSessionFactoryRef'
    - '@Transactional'
    must_resolve:
    - all datasources
    - mapper to factory binding
    - transaction manager qualifiers
    - SpringBootVFS
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - EXPLICIT_WIRING
  - RESTORE_VFS_IF_NEEDED
  - REVIEW_TRANSACTION_CROSSING
  verification:
    required:
    - write to correct datasource
    - nested rollback
    - read-only tx
    - jar packaging
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_DOC
  - MYBATIS_SPRING_REQ
  review_status: DOCUMENTATION_GROUNDED_PROJECT_VALIDATION_PENDING
- id: MYB4-BATCH-006
  title: ExecutorType.BATCH / Flush / Rollback
  category: BEHAVIOR_CONTRACT_RISK
  severity: HIGH
  priority: P1
  evidence_class: COMPATIBILITY_ASSESSMENT
  documented_change_or_risk: BATCH 與 SIMPLE/REUSE 執行模型不同；升級要測 SQL 副作用，不能只確認 Mapper 可啟動。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - ExecutorType.BATCH
    - SqlSession.flushStatements
    - batch executor
    must_resolve:
    - source executor type
    - transaction boundary
    - batch size and driver
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - NO_CHANGE_IF_MATCH
  - ADJUST_WITH_EVIDENCE
  - REVIEW_NON_ATOMIC_BATCH
  verification:
    required:
    - batch row counts
    - generated keys
    - commit/rollback
    - duplicate-key partial failure
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_DOC
  - MYBATIS_SPRING_REQ
  review_status: RISK_ASSESSMENT_REQUIRES_PROJECT_EVIDENCE
- id: MYB4-SQL-007
  title: Dynamic SQL、Provider 與攔截器
  category: SQL_SEMANTICS_RISK
  severity: HIGH
  priority: P1
  evidence_class: COMPATIBILITY_ASSESSMENT
  documented_change_or_risk: 檢查動態 SQL 與 Interceptor 對生成語句的影響，尤其有資料庫方言與租戶條件時。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - <if>
    - <where>
    - <foreach>
    - '@SelectProvider'
    - Interceptor
    - StatementHandler
    must_resolve:
    - active XML
    - provider variants
    - dialect
    - pagination plugin order
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - FIX_ONLY_PROVEN_SQL_DIFF
  - NO_CHANGE_IF_MATCH
  - REVIEW_UNTRUSTED_SQL
  verification:
    required:
    - SQL with parameter set
    - explain on real dialect
    - rows, order, pagination
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_DOC
  review_status: RISK_ASSESSMENT_REQUIRES_PROJECT_EVIDENCE
