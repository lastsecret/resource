[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java-api-test-engineer"
version = "0.1.0"
description = "Deterministic Java API discovery, request generation, execution, coverage and A/B regression comparison"
requires-python = ">=3.10"
authors = [{name = "Java API Test Engineer contributors"}]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8", "PyYAML>=6.0"]

[project.scripts]
japi = "japi.cli:main"

[tool.setuptools.packages.find]
include = ["japi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
japi = ["tools/*.java"]
