- id: HIB7-API-REMOVAL-008
  title: Hibernate Session 舊生命週期 API 移除
  category: BREAKING_API
  severity: HIGH
  documented_change: Session#load、save、update、saveOrUpdate、delete 等方法在 Hibernate 7 受到移除；應依 transient/detached/managed
    語義分別轉換。
