- id: HIB7-NATIVE-DATETIME-001
  title: Native SQL 無顯式映射時時間型別由 java.sql 改為 java.time
  category: DEFAULT_BEHAVIOR_CHANGE
  severity: HIGH
  documented_change: Hibernate 7 無 @SqlResultSetMapping 的 native query 預設時間結果型別改為 LocalDate/LocalTime/LocalDateTime；舊版預設為
    java.sql.Date/Time/Timestamp。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    source_component_version: resolve actual dependency
    target_component_version: resolve actual dependency
    requires:
    - nativeQuery=true or createNativeQuery()
    - scalar temporal SQL columns or Object[] / Tuple casts
  investigation:
    must_resolve:
    - actual Hibernate ORM versions
    - native query projection and @SqlResultSetMapping / addScalar / DTO mapping
    - JDBC driver metadata and SQL casts
    - consumer cast / conversion path
    - hibernate.query.native.prefer_jdbc_datetime_types actual value
    effective_configuration_policy: OBSERVE_EFFECTIVE_SOURCE_AND_TARGET; USE_VERSION_DEFAULTS_ONLY_WHEN_OVERRIDE_ABSENCE_IS_CONFIRMED
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - NO_CHANGE_IF_RESULT_CONTRACT_ALREADY_COMPATIBLE
  - ADAPT_LOCAL_RESULT_MAPPING
  - RETAIN_LEGACY_RESULT_TYPES_WITH_EXPLICIT_CONFIG_AFTER_REVIEW
  verification:
    required:
    - NATIVE_QUERY_SCALAR_TYPES
    - OBJECT_ARRAY_CAST
    - DTO_PROJECTION
    - NULL_AND_TIME_COMPONENT
    - ORIGINAL_SQL_DATABASE
    pass_criteria: TARGET_MATCHES_MEASURED_SOURCE_CONTRACT_OR_APPROVED_DEVIATION
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_UNSEEN_CONFIG_IS_ABSENT
  - CLAIM_PASS_WITHOUT_RUNTIME_OR_TEST_EVIDENCE
  sources:
  - HIB7_MIGRATION
  workflow_phase: ASSESS
  caveat: 規則只針對沒有明確 result mapping 的 native query 預設；不可把所有 @Query 或 JPQL 都當成受影響。
  migration_evidence_v0_5:
    classification: BEHAVIOR_CHANGE
