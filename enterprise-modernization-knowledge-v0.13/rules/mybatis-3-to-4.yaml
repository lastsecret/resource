schema_version: '0.5'
knowledge_pack: spring-boot-3-to-4
scope: Spring Boot 3.5.x -> 4.0.x; Java target is resolved from migration config; exact component versions
  required
rules:
- id: MYB4-STARTER-001
  title: MyBatis Starter 版本相容性
  category: DEPENDENCY_CHANGE
  severity: HIGH
  priority: P0
  documented_change_or_risk: MyBatis-Spring-Boot-Starter 3.0 系列對應 Boot 3.2–3.5；4.0 系列對應 Boot 4.0；MyBatis-Spring
    4.0 對應 Spring Framework 7；MyBatis Core 仍為 3.5 系列。
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    requires_feature_presence: true
    component_versions: resolve exact effective versions and dependency graph
    confidence_without_project_inspection: UNKNOWN
  investigation:
    detect_signals:
    - org.mybatis.spring.boot:mybatis-spring-boot-starter
    - org.mybatis:mybatis-spring
    - org.mybatis:mybatis
    must_resolve:
    - exact Boot Framework
    - starter
    - MyBatis-Spring
    - MyBatis Core and BOM versions; Nexus availability
    effective_configuration_policy: SOURCE_RUNTIME_FIRST; INSPECT_OVERRIDES; ONLY_IF_NO_EFFECTIVE_OVERRIDE_COMPARE_VERSION_DEFAULTS
    unknown_policy: REVIEW_REQUIRED
  candidate_decisions:
  - ALIGN_VERIFIED_VERSION_MATRIX
  - REVIEW_OVERRIDES
  - KEEP_CORE_3_5_IF_SUPPORTED
  verification:
    required:
    - dependency convergence
    - context startup
    - mapper select
    pass_criteria: EQUIVALENT_SOURCE_TARGET_BEHAVIOR_OR_EXPLICITLY_APPROVED_DEVIATION
    actual_result: NOT_RUN
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_CONFIG_ABSENT_WITHOUT_PROOF
  - AUTO_APPROVE_SECURITY_CHANGE
  - CLAIM_PASS_FROM_BUILD_ONLY
  sources:
  - MYBATIS_STARTER_REQ
  - MYBATIS_SPRING_REQ
  migration_evidence_v0_5:
    classification: BREAKING_CHANGE
    rule_kind: MIGRATION_DELTA
    source_version_scope: resolve actual source
    target_version_scope: resolve actual target
    evidence_status: OFFICIAL_DOC_SECTION_CHECKED
    evidence:
      references:
      - source_id: MYBATIS_STARTER_REQ
        section: Requirements compatibility matrix
      - source_id: MYBATIS_SPRING_REQ
        section: REVIEW_REQUIRED
      note: 官方文件可作為遷移差異來源；仍須以實際有效設定／專案使用證據確認是否命中
    trigger:
      requires_project_feature_detection: true
      requires_exact_resolved_versions: true
      requires_effective_source_configuration: true
      requires_target_behavior_or_runtime_evidence: false
    remediation_policy:
      mode: CONDITIONAL_RECOMMENDATION_ONLY
      automatic_patch: false
      requires_human_approval: true
      prerequisites:
      - EXACT_VERSION_COMPATIBILITY
      - FEATURE_PRESENT
      - SOURCE_EFFECTIVE_CONFIG_RESOLVED
      - SOURCE_BEHAVIOR_CAPTURED_OR_ACCEPTED_SPEC
      - TARGET_BEHAVIOR_VERIFIED
      blocked_if:
      - UNCONFIRMED_BREAKING_CHANGE
      - UNKNOWN_EFFECTIVE_CONFIGURATION
      - NO_BASELINE_EVIDENCE
      - UNAPPROVED_BEHAVIOR_CHANGE
    runtime_validation: NOT_RUN
  legacy_evidence_class_v0_4: DOCUMENTED_CHANGE
  legacy_review_status_v0_4: DOCUMENTATION_GROUNDED_PROJECT_VALIDATION_PENDING
  rule_type: BREAKING_CHANGE
  actionable: false
