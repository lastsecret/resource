schema_version: '0.5'
knowledge_pack: spring-boot-3-to-4
evidence_policy: EVIDENCE-POLICY.md
scope: JDK resolved from migration config; exact effective component versions required
rules:
- id: HCP7-SCHEMA-001
  title: 7.0.0 setSchema 已知回歸
  category: VERSION_REGRESSION
  severity: HIGH
  priority: P1
  documented_change_or_risk: 官方變更紀錄記載 7.0.1 修正 setSchema 回歸；只有目標實際解析為 7.0.0 且程式使用相關功能時命中。
  sources:
  - HIKARI_CHANGES
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    exact_component_scope: only HikariCP 7.0.0; fixed in 7.0.1
    requires_feature_presence: true
  investigation:
    detect_signals:
    - HikariDataSource
    - setSchema(
    - connectionInitSql
    must_resolve:
    - actual dependency tree / BOM / explicit overrides
    - source runtime effective config
    - relevant source behavior contract
    effective_configuration_policy: OBSERVE_SOURCE_FIRST; VERSION_DEFAULTS_ONLY_WITH_CONFIRMED_OVERRIDE_ABSENCE
    unknown_policy: REVIEW_REQUIRED
  verification:
    required:
    - TARGET_HIKARI_VERSION_7_0_0
    - SCHEMA_SET_GET_RESTORE
    actual_result: NOT_RUN
    pass_criteria: EQUIVALENT_OR_APPROVED_DEVIATION
  candidate_decisions:
  - RUN_TARGETED_REGRESSION_CHECK
  - NO_CHANGE_WITHOUT_CONFIRMED_DELTA
  - REVIEW_IF_ACTUAL_BEHAVIOR_DIFFERS
  prohibited:
  - UNCONDITIONAL_PATCH
  - ASSUME_VERSION_UPGRADE_MEANS_BREAKING_CHANGE
  - CLAIM_PASS_WITHOUT_RUNTIME_EVIDENCE
  migration_evidence_v0_5:
    classification: REGRESSION
    rule_kind: VERIFICATION_CASE
    source_version_scope: resolve actual source
    target_version_scope: resolve actual target
    evidence_status: OFFICIAL_CHANGELOG_CONFIRMED
    evidence:
      references:
      - source_id: HIKARI_CHANGES
        section: Changes in 7.0.1 — fix regression with setSchema behavior
      note: 沒有已確認且精確對應本版本區間的通用 Breaking Change；保留受影響功能的回歸測試，不產生自動修正
    trigger:
      requires_project_feature_detection: true
      requires_exact_resolved_versions: true
      requires_effective_source_configuration: true
      requires_target_behavior_or_runtime_evidence: false
      exact_affected_target: 7.0.0
    remediation_policy:
      mode: AVOID_KNOWN_DEFECT_VERSION_OR_REVIEW_PATCH
      automatic_patch: false
      requires_human_approval: true
      prerequisites:
      - EXACT_VERSION_COMPATIBILITY
      - FEATURE_PRESENT
      - SOURCE_EFFECTIVE_CONFIG_RESOLVED
      - SOURCE_BEHAVIOR_CAPTURED_OR_ACCEPTED_SPEC
      - TARGET_BEHAVIOR_VERIFIED
      blocked_if:
      - UNCONFIRMED_BREAKING_CHANGE
      - UNKNOWN_EFFECTIVE_CONFIGURATION
      - NO_BASELINE_EVIDENCE
      - UNAPPROVED_BEHAVIOR_CHANGE
    runtime_validation: NOT_RUN
  rule_type: REGRESSION
  actionable: false
