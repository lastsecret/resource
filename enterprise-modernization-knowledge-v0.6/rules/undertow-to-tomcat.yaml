- id: WEB-UNDERTOW-002
  title: Undertow Worker / IO 設定不能直接換算成 Tomcat 執行緒
  category: SERVER_CONCURRENCY_SEMANTICS
  severity: HIGH
  applicability:
    source_spring_boot: 3.5.x
    target_spring_boot: 4.0.x
    source_component_version: resolve actual dependency
    target_component_version: resolve actual dependency
    requires:
    - server.undertow.threads.worker or server.undertow.threads.io
    - custom XNIO worker or UndertowBuilderCustomizer
    - existing throughput/SLA requirement
  investigation:
    must_resolve:
    - effective Undertow worker/io counts and blocking handlers
    - sync HTTP wait, synchronized lock and @Transactional boundaries
    - Tomcat threads.max/min-spare, max-connections, accept-count and executor
    - CPU/quota/container memory
    - virtual threads enabled or not
